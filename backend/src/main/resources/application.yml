spring:
  application:
    name: meowpay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meowpay}
    username: ${DATABASE_USER:meowpay}
    password: ${DATABASE_PASSWORD:meowpay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
