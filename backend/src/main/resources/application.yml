spring:
  application:
    name: meowpay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meowpay}
    username: ${DATABASE_USER:meowpay}
    password: ${DATABASE_PASSWORD:meowpay}
    hikari:
      # A pathological lock wait should fail fast as a retryable 503 rather than
      # pinning a request thread indefinitely. Ordered acquisition means this should
      # never fire; if it does, it is a signal worth alerting on.
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Only the health endpoint is exposed. Actuator ships a good deal more -- env,
# beans, mappings -- and none of it should be reachable on an unauthenticated
# service just because the dependency is present.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # The DB check is the point: "up" must mean the ledger is actually usable,
      # not merely that the JVM answered.
      show-details: never
      probes:
        enabled: true
