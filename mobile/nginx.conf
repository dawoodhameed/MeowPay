server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Flutter web is a single-page app: any unmatched path must return index.html
    # so a deep link or a refresh does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is proxied rather than called directly from the browser. A native
    # build talks to the backend over HTTP with no same-origin rule, but the web
    # build is subject to CORS -- and proxying is preferable to opening the
    # backend's CORS policy just so a demo target can reach it.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
